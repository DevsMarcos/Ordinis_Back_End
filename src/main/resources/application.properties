# URL de conexao (troque 'nome_do_seu_banco' pelo nome da base criada no MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/ordem_servico?createDatabaseIfNotExist=true&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=nova_senha

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuracoes de desenvolvimento
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true