# URL de conexão: troque 'nome_do_seu_banco' pelo nome da base que você criou no MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ordem_servico?createDatabaseIfNotExist=true&serverTimezone=UTC

# Credenciais que você acabou de configurar
spring.datasource.username=root
spring.datasource.password=nova_senha

# Driver e dialeto (ajudam o Hibernate a gerar o SQL correto para MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configurações de desenvolvimento
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

