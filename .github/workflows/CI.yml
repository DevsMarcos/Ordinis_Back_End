name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password_ci
          MYSQL_DATABASE: ordem_servico
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build com Maven
        run: mvn -B compile --file pom.xml

      - name: Rodar testes
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: ordem_servico
          DB_USERNAME: root
          DB_PASSWORD: test_password_ci
          DDL_AUTO: create-drop
        run: mvn -B test --file pom.xml

      - name: Empacotar aplicação
        run: mvn -B package -DskipTests --file pom.xml

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
