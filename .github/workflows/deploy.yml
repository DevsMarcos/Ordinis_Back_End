name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório para o runner
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o JDK (ajuste a versão conforme seu projeto)
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Compila o projeto
      - name: Build com Maven
        run: mvn -B compile --file pom.xml

      # 4. Executa os testes automatizados
      - name: Rodar testes
        run: mvn -B test --file pom.xml

      # 5. Gera o artefato final (.jar)
      - name: Empacotar aplicação
        run: mvn -B package -DskipTests --file pom.xml

      # 6. Guarda o .jar gerado como artefato do workflow
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar